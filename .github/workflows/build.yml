name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir -p source
          unzip -o BlackjackAIAnalyzer_Free_Android_Project.zip -d source

      - name: Find Android project
        run: |
          APP_DIR=$(find source -type f -path '*/app/build.gradle' | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Android app/build.gradle not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$(dirname "$APP_DIR")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"      - name: Fix JVM target compatibility
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle"
          s = p.read_text()
          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """,
              1
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blackjack-AI-Analyzer-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
