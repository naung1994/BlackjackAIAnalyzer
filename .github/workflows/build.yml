name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir -p source
          unzip -o BlackjackAIAnalyzer_Free_Android_Project.zip -d source

      - name: Find Android project
        run: |
          APP_DIR=$(find source -type f -path '*/app/build.gradle' | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Android app/build.gradle not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$(dirname "$APP_DIR")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blackjack-AI-Analyzer-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
