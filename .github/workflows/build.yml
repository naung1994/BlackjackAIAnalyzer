
name: Build Blackjack AI Analyzer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses Automatically
        run: |
          yes | sdkmanager --licenses || true

      - name: Extract project ZIP
        run: |
          mkdir -p source
          if [ -f "BlackjackAIAnalyzer_ScreenCapture_Project.zip" ]; then
            unzip -o BlackjackAIAnalyzer_ScreenCapture_Project.zip -d source
          else
            echo "Error: BlackjackAIAnalyzer_ScreenCapture_Project.zip file not found!"
            exit 1
          fi

      - name: Locate Android Project Root
        run: |
          BUILD_GRADLE_PATH=$(find source -name "build.gradle" -o -name "build.gradle.kts" | grep "app/" | head -n 1)
          if [ -z "$BUILD_GRADLE_PATH" ]; then
            echo "Error: app/build.gradle not found in extracted ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$(dirname "$BUILD_GRADLE_PATH")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project at: $PROJECT_DIR"

      - name: Configure Gradle & JVM Compatibility
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project_dir_env = os.environ.get("PROJECT_DIR")
          if not project_dir_env:
              print("Error: PROJECT_DIR environment variable is not set.")
              exit(1)

          project_dir = Path(project_dir_env)
          app_gradle = project_dir / "app" / "build.gradle"
          app_gradle_kts = project_dir / "app" / "build.gradle.kts"

          target_file = app_gradle if app_gradle.exists() else (app_gradle_kts if app_gradle_kts.exists() else None)

          if target_file and target_file.exists():
              content = target_file.read_text()
              if "compileOptions" not in content:
                  java17_config = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              """
                  content = content.replace("android {", "android {\n" + java17_config, 1)
                  target_file.write_text(content)
                  print("Updated build.gradle with Java 17 options.")
          else:
              print("Warning: build.gradle / build.gradle.kts not found inside app folder.")
          PY

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generation
        run: |
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file was not generated."
            exit 1
          fi
          echo "FINAL_APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blackjack-AI-Live-Analyzer-APK
          path: ${{ env.FINAL_APK_PATH }}
